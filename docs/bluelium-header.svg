      <rect x="40" y="236" width="160" height="90" rx="10" fill="#dfe2ef"/>
      <rect x="216" y="236" width="160" height="90" rx="10" fill="#dfe2ef"/>
      <rect x="392" y="236" width="160" height="90" rx="10" fill="#dfe2ef"/>

      <!-- Panneau IA -->
      <rect x="620" y="94" width="274" height="260" rx="10" fill="#1a2040"/>
      <rect x="634" y="106" width="212" height="26" rx="13" fill="#11162b"/>
      <rect x="637" y="109" width="52" height="20" rx="10" fill="#3450d1"/>
      <rect x="649" y="116" width="28" height="6" rx="3" fill="#ffffff"/>
      <rect x="701" y="116" width="28" height="6" rx="3" fill="#4a5488"/>
      <rect x="753" y="116" width="28" height="6" rx="3" fill="#4a5488"/>
