<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Bluelium, schéma de la fenêtre</title>
  <desc id="d">Dessin schématique, pas une capture d'écran : barre d'onglets, barre d'adresse, page et panneau IA à droite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1022"/>
      <stop offset="1" stop-color="#18224f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3450d1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3450d1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3450d1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <ellipse cx="600" cy="392" rx="520" ry="70" fill="url(#glow)"/>

    <!-- Fenêtre -->
    <g transform="translate(150 44)">
      <rect width="900" height="336" rx="14" fill="#11162b" stroke="#2a3360" stroke-width="1.5"/>

