      <rect x="752" y="60" width="20" height="18" rx="4" fill="none" stroke="#8f9bd6" stroke-width="2.200"/>
      <rect x="761" y="60" width="2.200" height="18" fill="#8f9bd6"/>
      <rect x="788" y="60" width="18" height="18" rx="5" fill="none" stroke="#8f9bd6" stroke-width="2.200"/>
      <rect x="820" y="59" width="1.5" height="20" fill="#2a3360"/>
      <circle cx="846" cy="69" r="14" fill="#3450d1"/>
      <path d="M846 60.500l2.300 6.200 6.200 2.300-6.200 2.300-2.300 6.200-2.300-6.200-6.200-2.300 6.200-2.300z" fill="#ffffff"/>
      <circle cx="878" cy="62" r="1.900" fill="#8f9bd6"/>
