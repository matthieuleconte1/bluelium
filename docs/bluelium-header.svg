      <circle cx="98" cy="24" r="6" fill="#3450d1"/>
      <rect x="112" y="20" width="84" height="8" rx="4" fill="#8f9bd6"/>
      <circle cx="254" cy="24" r="6" fill="#4a5488"/>
      <rect x="268" y="20" width="76" height="8" rx="4" fill="#3a4370"/>
      <rect x="388" y="14" width="1.5" height="20" fill="#2a3360"/>
      <circle cx="410" cy="24" r="6" fill="#4a5488"/>
      <rect x="424" y="20" width="92" height="8" rx="4" fill="#3a4370"/>
      <rect x="544" y="14" width="1.5" height="20" fill="#2a3360"/>
      <!-- « + » -->
      <rect x="562" y="22.5" width="13" height="3" rx="1.5" fill="#8f9bd6"/>
      <rect x="567" y="17.5" width="3" height="13" rx="1.5" fill="#8f9bd6"/>

      <!-- Navigation -->
      <path d="M26 62l-7 7 7 7" fill="none" stroke="#6672ad" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M48 62l7 7-7 7" fill="none" stroke="#3a4370" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M86 69a8 8 0 1 1-2.6-5.9" fill="none" stroke="#6672ad" stroke-width="2.4" stroke-linecap="round"/>

      <!-- Adresse -->
      <rect x="108" y="54" width="596" height="30" rx="15" fill="#1a2040"/>
      <rect x="126" y="65" width="170" height="8" rx="4" fill="#4a5488"/>

      <!-- Outils : bouclier, Diviser, extensions, séparateur, IA, menu -->
