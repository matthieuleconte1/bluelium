      <circle cx="22" cy="24" r="5" fill="#3a4370"/>
      <circle cx="40" cy="24" r="5" fill="#3a4370"/>
      <circle cx="58" cy="24" r="5" fill="#3a4370"/>

      <!-- Onglets -->
