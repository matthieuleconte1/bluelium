      <rect x="620" y="142" width="274" height="1.500" fill="#2a3360"/>
      <rect x="700" y="162" width="180" height="34" rx="12" fill="#3450d1"/>
      <rect x="716" y="175" width="120" height="8" rx="4" fill="#c9d1ff"/>
      <rect x="634" y="210" width="210" height="8" rx="4" fill="#4a5488"/>
      <rect x="634" y="228" width="180" height="8" rx="4" fill="#4a5488"/>
      <rect x="634" y="246" width="196" height="8" rx="4" fill="#4a5488"/>
      <rect x="634" y="296" width="246" height="34" rx="17" fill="#11162b" stroke="#2a3360" stroke-width="1.500"/>
